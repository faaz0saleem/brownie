<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brownie Bliss | Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <div class="noise"></div>

  <header class="nav">
    <div class="container">
      <div class="nav-inner">
        <a class="brand" href="index.html"><span class="logo">BB</span> Brownie Bliss</a>
        <nav class="nav-links">
          <a href="index.html">Home</a>
          <a href="products.html">Products</a>
          <a href="cart.html">Cart (<span class="cart-count">0</span>)</a>
          <a href="checkout.html">Checkout</a>
          <a class="active" href="admin.html">Admin</a>
        </nav>
        <a class="nav-cta" href="products.html">Storefront</a>
        <button class="menu-btn" id="menuBtn" aria-label="Open menu">Menu</button>
      </div>
      <div class="mobile-links" id="mobileLinks">
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="cart.html">Cart (<span class="cart-count">0</span>)</a>
        <a href="checkout.html">Checkout</a>
        <a href="admin.html">Admin</a>
      </div>
    </div>
  </header>

  <main>
    <section class="container">
      <div class="section-head">
        <h2>Admin Dashboard</h2>
        <p>Manage products and view all COD orders submitted from checkout.</p>
      </div>

      <div class="kpi-grid" id="kpis"></div>

      <div class="page-grid">
        <article class="panel">
          <h3>Add Product</h3>
          <form id="addProductForm" class="form-grid">
            <label>Name
              <input name="name" required />
            </label>
            <label>Short Description
              <input name="shortDescription" required />
            </label>
            <label>Full Description
              <textarea name="description" required></textarea>
            </label>
            <label>Price (PKR)
              <input name="pricePkr" type="number" min="1" required />
            </label>
            <label>Badge
              <input name="badge" placeholder="Fresh" />
            </label>
            <label>Tone
              <select name="tone">
                <option value="tone-1">Tone 1</option>
                <option value="tone-2">Tone 2</option>
                <option value="tone-3">Tone 3</option>
              </select>
            </label>
            <button type="submit" class="btn btn-primary">Add Product</button>
          </form>
        </article>

        <article class="panel">
          <h3>Products</h3>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Price</th>
                  <th>Badge</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="productsTable"></tbody>
            </table>
          </div>
        </article>
      </div>

      <article class="panel" style="margin-top: 20px;">
        <h3>Orders (COD)</h3>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Order</th>
                <th>Customer</th>
                <th>Items</th>
                <th>Total</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="ordersTable"></tbody>
          </table>
        </div>
      </article>
    </section>
  </main>

  <script src="assets/store.js"></script>
  <script src="assets/site.js"></script>
  <script>
    const store = window.BrownieStore;
    const kpiNode = document.getElementById("kpis");
    const productsTable = document.getElementById("productsTable");
    const ordersTable = document.getElementById("ordersTable");

    function renderKpis() {
      const products = store.getProducts();
      const orders = store.getOrders();
      const revenue = orders.reduce((sum, order) => sum + order.totals.total, 0);

      kpiNode.innerHTML = `
        <div class="kpi"><strong>${products.length}</strong><span class="small">Active Products</span></div>
        <div class="kpi"><strong>${orders.length}</strong><span class="small">Total Orders</span></div>
        <div class="kpi"><strong>${store.formatPkr(revenue)}</strong><span class="small">Gross COD Value</span></div>
      `;
    }

    function renderProducts() {
      const products = store.getProducts();
      productsTable.innerHTML = products.map((product) => `
        <tr>
          <td>${product.name}</td>
          <td>${store.formatPkr(product.pricePkr)}</td>
          <td>${product.badge || "Fresh"}</td>
          <td><button class="btn btn-secondary" data-delete="${product.id}">Delete</button></td>
        </tr>
      `).join("");

      productsTable.querySelectorAll("button[data-delete]").forEach((button) => {
        button.addEventListener("click", () => {
          const proceed = confirm("Delete this product?");
          if (!proceed) {
            return;
          }
          store.deleteProduct(button.dataset.delete);
          refreshAll();
        });
      });
    }

    function renderOrders() {
      const orders = store.getOrders();
      if (!orders.length) {
        ordersTable.innerHTML = "<tr><td colspan='5'>No orders yet.</td></tr>";
        return;
      }

      ordersTable.innerHTML = orders.map((order) => `
        <tr>
          <td>
            <strong>${order.id}</strong>
            <div class="small">${new Date(order.createdAt).toLocaleString()}</div>
            <div class="small">${order.paymentMethod}</div>
          </td>
          <td>
            <strong>${order.customer.fullName}</strong>
            <div class="small">${order.customer.phone}</div>
            <div class="small">${order.customer.city}</div>
          </td>
          <td>
            ${order.items.map((item) => `<div class='small'>${item.name} x ${item.qty}</div>`).join("")}
          </td>
          <td>${store.formatPkr(order.totals.total)}</td>
          <td>
            <select data-status="${order.id}">
              <option value="Pending" ${order.status === "Pending" ? "selected" : ""}>Pending</option>
              <option value="Confirmed" ${order.status === "Confirmed" ? "selected" : ""}>Confirmed</option>
              <option value="Dispatched" ${order.status === "Dispatched" ? "selected" : ""}>Dispatched</option>
              <option value="Delivered" ${order.status === "Delivered" ? "selected" : ""}>Delivered</option>
              <option value="Cancelled" ${order.status === "Cancelled" ? "selected" : ""}>Cancelled</option>
            </select>
          </td>
        </tr>
      `).join("");

      ordersTable.querySelectorAll("select[data-status]").forEach((select) => {
        select.addEventListener("change", () => {
          store.updateOrderStatus(select.dataset.status, select.value);
          renderKpis();
        });
      });
    }

    function refreshAll() {
      renderKpis();
      renderProducts();
      renderOrders();
    }

    document.getElementById("addProductForm").addEventListener("submit", (event) => {
      event.preventDefault();
      const data = new FormData(event.target);
      store.createProduct({
        name: data.get("name"),
        shortDescription: data.get("shortDescription"),
        description: data.get("description"),
        pricePkr: data.get("pricePkr"),
        badge: data.get("badge"),
        tone: data.get("tone")
      });
      event.target.reset();
      refreshAll();
    });

    refreshAll();
  </script>
</body>
</html>
