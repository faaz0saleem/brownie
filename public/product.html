<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brownie Bliss — Product</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%AB%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <header class="site-header">
    <div class="wrap nav">
      <a href="/" class="brand">
        <span class="logo">🍫</span>
        <span>Brownie Bliss<small>Fresh · Fudgy · COD</small></span>
      </a>
      <nav class="nav-links">
        <a href="/#menu">Menu</a>
        <a href="/#why">Why Us</a>
        <a href="/#story">Our Story</a>
      </nav>
      <button class="cart-btn" onclick="openCart()">
        🛒 Cart <span class="cart-count" id="cartCount">0</span>
      </button>
    </div>
  </header>

  <main class="wrap">
    <a href="/#menu" class="back-link">← Back to menu</a>
    <div id="pdRoot">
      <div class="cart-empty"><div class="em">⏳</div>Loading…</div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-grid">
      <a href="/" class="brand"><span class="logo">🍫</span> Brownie Bliss</a>
      <div>Cash on Delivery only · Baked fresh daily · Made with 💛</div>
      <div>© 2026 Brownie Bliss</div>
    </div>
  </footer>

  <div class="drawer-overlay" id="drawerOverlay" onclick="closeCart()"></div>
  <aside class="drawer" id="drawer" aria-label="Shopping cart">
    <div class="drawer-head">
      <h3>Your Cart 🛒</h3>
      <button class="drawer-close" onclick="closeCart()">×</button>
    </div>
    <div class="drawer-body" id="cartBody"></div>
    <div class="drawer-foot" id="cartFoot"></div>
  </aside>

  <div class="modal-overlay" id="checkoutModal">
    <div class="modal" id="checkoutInner"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="/app.js"></script>
  <script>renderProductPage();</script>
</body>
</html>
