<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Menu · Fudgio — Handcrafted Brownies</title>
<meta name="description" content="Browse Fudgio's three signature handcrafted brownies — Classic Chocolate, Nutty Delight and Salted Caramel. Cash on Delivery only."/>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg"/>
<link rel="alternate icon" href="/assets/favicon.png"/>
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png"/>
<meta name="theme-color" content="#d98e4a"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<!-- Fonts must not block rendering: the brownie list is drawn by JS that runs
     after this tag, so a slow font CDN would leave customers on an empty menu. -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Fraunces:opsz,wght@9..144,700;9..144,900&display=swap" onload="this.onload=null;this.rel='stylesheet'"/>
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Fraunces:opsz,wght@9..144,700;9..144,900&display=swap"/></noscript>
<link rel="stylesheet" href="/assets/store.css"/>
</head>
<body>
<header class="site-header"><div class="wrap nav">
  <a href="/" class="brand"><span class="logo">🍫</span><span class="brand-name">Fudgio<small>Fresh · Fudgy · COD</small></span></a>
  <nav class="nav-links"><a href="/">Home</a><a href="/menu">Menu</a><a href="/about">About</a><a href="/faq">FAQ</a><a href="/contact">Contact</a></nav>
  <a href="/cart" class="cart-btn">🛒 <span class="cart-count" id="cartCount">0</span></a>
</div></header>

<main class="page"><div class="wrap">
  <div class="crumbs"><a href="/">Home</a> ›<span class="on">Menu</span></div>
  <div class="section-head" style="text-align:left;margin-bottom:30px">
    <span class="eyebrow">🍫 Our Menu</span>
    <h2 style="margin-top:6px">Three flavours. Zero compromise.</h2>
    <p style="margin-left:0">Each brownie is baked in small batches from our secret recipe. Pick a flavour to choose your box size and quantity.</p>
  </div>
  <div class="grid" id="grid"></div>
  <noscript>
    <!-- Crawlers and link previews that don't run JavaScript still get the menu. -->
    <div class="grid">
      <a class="card" href="/product?b=chocolate"><div class="card-art" style="background:linear-gradient(135deg,#5b3a29,#2b1a12)"><span>&#127851;</span></div>
        <div class="card-body"><h3>Classic Chocolate</h3><div class="tagline">The original, impossibly fudgy</div>
        <div class="card-foot"><div class="price">from Rs 190</div><span class="card-btn">Choose &rarr;</span></div></div></a>
      <a class="card" href="/product?b=nutty-delight"><div class="card-art" style="background:linear-gradient(135deg,#6d4c2f,#3a2417)"><span>&#127792;</span></div>
        <div class="card-body"><h3>Nutty Delight</h3><div class="tagline">Loaded with toasted nuts &mdash; contains nuts</div>
        <div class="card-foot"><div class="price">from Rs 220</div><span class="card-btn">Choose &rarr;</span></div></div></a>
      <a class="card" href="/product?b=salted-caramel"><div class="card-art" style="background:linear-gradient(135deg,#a06a34,#3b230f)"><span>&#127855;</span></div>
        <div class="card-body"><h3>Salted Caramel</h3><div class="tagline">Sweet, salty, unforgettable</div>
        <div class="card-foot"><div class="price">from Rs 220</div><span class="card-btn">Choose &rarr;</span></div></div></a>
    </div>
  </noscript>

</div></main>

<footer class="site-footer"><div class="wrap">© <span id="yr"></span> Fudgio · Cash on Delivery only · Handcrafted with 💛</div></footer>
<div class="toast" id="toast"></div>

<script src="/assets/store.js"></script>
<script>
document.getElementById('yr').textContent=new Date().getFullYear();
renderGrid('grid');
updateCount();
</script>
</body>
</html>
