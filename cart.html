<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Your Cart · Fudgio</title>
<meta name="robots" content="noindex"/>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%AB%3C/text%3E%3C/svg%3E"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Fraunces:opsz,wght@9..144,700;9..144,900&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/assets/store.css"/>
</head>
<body>
<header class="site-header"><div class="wrap nav">
  <a href="/" class="brand"><span class="logo">🍫</span><span class="brand-name">Fudgio<small>Fresh · Fudgy · COD</small></span></a>
  <nav class="nav-links"><a href="/#menu">Menu</a><a href="/#why">Why Us</a><a href="/#how">How it works</a></nav>
  <a href="/cart.html" class="cart-btn">🛒 <span class="cart-count" id="cartCount">0</span></a>
</div></header>

<main class="page"><div class="wrap">
  <div class="crumbs"><a href="/">Home</a> ›<span class="on">Cart</span></div>
  <h1>Your Cart</h1>
  <div class="sub">Review your brownies, then continue to checkout — Cash on Delivery.</div>
  <div class="steps-bar"><div class="s on"><span class="b">1</span>Cart</div><div class="sep"></div><div class="s"><span class="b">2</span>Details</div><div class="sep"></div><div class="s"><span class="b">3</span>Done</div></div>
  <div id="root"></div>
</div></main>

<footer class="site-footer"><div class="wrap">© <span id="yr"></span> Fudgio · Cash on Delivery only · Handcrafted with 💛</div></footer>
<div class="toast" id="toast"></div>

<script src="/assets/store.js"></script>
<script>
document.getElementById('yr').textContent=new Date().getFullYear();
function render(){
  var cart=getCart(), root=document.getElementById('root');
  if(!cart.length){ root.innerHTML='<div class="empty"><div class="em">🛒</div><p>Your cart is empty.</p><a href="/#menu" class="btn btn-primary" style="margin-top:18px">Browse the menu</a></div>'; updateCount(); return; }
  var items=cart.map(function(i){return '<div class="line"><div class="art" style="background:'+i.gradient+'">'+i.emoji+'</div>'
    +'<div class="info"><h4>'+i.name+'</h4><div class="meta">'+(i.size||'')+' · '+money(i.price)+' each</div>'
    +'<div class="stepper"><button onclick="chg(\''+i.key+'\',-1)">−</button><span>'+i.qty+'</span><button onclick="chg(\''+i.key+'\',1)">+</button></div></div>'
    +'<div class="right"><div class="p">'+money(i.price*i.qty)+'</div><button class="rm" onclick="rm(\''+i.key+'\')">Remove</button></div></div>';}).join('');
  root.innerHTML='<div class="split"><div class="panel"><h3>Items ('+cartQty()+')</h3>'+items+'</div>'
    +'<div class="panel summary"><h3>Order summary</h3>'
    +'<div class="srow"><span>Subtotal</span><span>'+money(cartSubtotal())+'</span></div>'
    +'<div class="srow"><span>Delivery</span><span>'+(cartDelivery()===0?'FREE':money(cartDelivery()))+'</span></div>'
    +'<div class="srow tot"><span>Total</span><span>'+money(cartTotal())+'</span></div>'
    +'<div class="cod">💵 Cash on Delivery only</div>'
    +'<a href="/checkout.html" class="btn btn-primary btn-block">Proceed to checkout →</a>'
    +'<a href="/#menu" class="btn btn-ghost btn-block" style="margin-top:10px">Add more brownies</a></div></div>';
  updateCount();
}
function chg(key,d){ var c=getCart(); var it=c.filter(function(i){return i.key===key;})[0]; if(!it)return; it.qty+=d; if(it.qty<=0)c=c.filter(function(i){return i.key!==key;}); saveCart(c); render(); }
function rm(key){ saveCart(getCart().filter(function(i){return i.key!==key;})); render(); toast('Removed'); }
render();
</script>
</body>
</html>
