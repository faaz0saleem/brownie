<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Checkout · Fudgio</title>
<meta name="robots" content="noindex"/>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg"/>
<link rel="alternate icon" href="/assets/favicon.png"/>
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png"/>
<meta name="theme-color" content="#d98e4a"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Fraunces:opsz,wght@9..144,700;9..144,900&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/assets/store.css"/>
</head>
<body>
<header class="site-header"><div class="wrap nav">
  <a href="/" class="brand"><span class="logo">🍫</span><span class="brand-name">Fudgio<small>Fresh · Fudgy · COD</small></span></a>
  <nav class="nav-links"><a href="/">Home</a><a href="/menu">Menu</a><a href="/about">About</a><a href="/faq">FAQ</a><a href="/contact">Contact</a></nav>
  <a href="/cart" class="cart-btn">🛒 <span class="cart-count" id="cartCount">0</span></a>
</div></header>

<main class="page"><div class="wrap">
  <div class="crumbs"><a href="/">Home</a> › <a href="/cart">Cart</a> ›<span class="on">Checkout</span></div>
  <h1>Checkout</h1>
  <div class="sub">Enter your delivery details. You'll pay cash when your brownies arrive.</div>
  <div class="steps-bar"><div class="s"><span class="b">1</span>Cart</div><div class="sep"></div><div class="s on"><span class="b">2</span>Details</div><div class="sep"></div><div class="s"><span class="b">3</span>Done</div></div>
  <div id="root"></div>
</div></main>

<footer class="site-footer"><div class="wrap">© <span id="yr"></span> Fudgio · Cash on Delivery only · Handcrafted with 💛</div></footer>
<div class="toast" id="toast"></div>

<script src="/assets/store.js"></script>
<script>
document.getElementById('yr').textContent=new Date().getFullYear();
function summaryHtml(){
  var rows=getCart().map(function(i){return '<div class="srow"><span>'+i.qty+'× '+i.name+(i.size?' ('+i.size+')':'')+'</span><span>'+money(i.price*i.qty)+'</span></div>';}).join('');
  return '<div class="panel summary"><h3>Order summary</h3>'+rows
    +'<div class="srow" style="border-top:1px solid var(--line);padding-top:10px"><span>Subtotal</span><span>'+money(cartSubtotal())+'</span></div>'
    +'<div class="srow"><span>Delivery</span><span>'+(cartDelivery()===0?'FREE':money(cartDelivery()))+'</span></div>'
    +'<div class="srow tot"><span>Total</span><span>'+money(cartTotal())+'</span></div>'
    +'<div class="cod">💵 Cash on Delivery only</div></div>';
}
function render(){
  var root=document.getElementById('root');
  if(!getCart().length){ root.innerHTML='<div class="empty"><div class="em">🛒</div><p>Your cart is empty.</p><a href="/menu" class="btn btn-primary" style="margin-top:18px">Browse the menu</a></div>'; updateCount(); return; }
  root.innerHTML='<div class="split"><div class="panel"><h3>Delivery details</h3>'
    +'<div class="pay"><div class="ico">💵</div><div><b>Cash on Delivery</b><br><small>Pay in cash when your brownies arrive. No online payment.</small></div></div>'
    +'<div class="err" id="err"></div>'
    +'<div class="fg"><label>Full name *</label><input id="fName" placeholder="e.g. Ayesha Khan"/></div>'
    +'<div class="frow"><div class="fg"><label>Phone *</label><input id="fPhone" type="tel" placeholder="03xx-xxxxxxx"/></div><div class="fg"><label>Email *</label><input id="fEmail" type="email" placeholder="you@email.com"/></div></div>'
    +'<div class="fg"><label>City *</label><input id="fCity" placeholder="e.g. Karachi"/></div>'
    +'<div class="fg"><label>Delivery address *</label><textarea id="fAddr" rows="2" placeholder="House #, street, area"></textarea></div>'
    +'<div class="fg"><label>Notes (optional)</label><input id="fNotes" placeholder="Landmark, delivery time, etc."/></div>'
    +'<button class="btn btn-primary btn-block" id="place" onclick="place()">Place order (COD) 🍫</button></div>'
    +summaryHtml()+'</div>';
  updateCount();
}
function place(){
  var v=function(id){return (document.getElementById(id).value||'').trim();};
  var name=v('fName'),phone=v('fPhone'),email=v('fEmail'),city=v('fCity'),addr=v('fAddr'),notes=v('fNotes');
  var err=document.getElementById('err');
  if(!name||!phone||!email||!city||!addr){ err.textContent='Please fill in name, phone, email, city and address.'; return; }
  if(!validPhone(phone)){ err.textContent='Please enter a valid phone number (10–15 digits).'; return; }
  if(!validEmail(email)){ err.textContent='Please enter a valid email address.'; return; }
  err.textContent='';
  var btn=document.getElementById('place'); btn.disabled=true; btn.textContent='Placing order…';
  var cart=getCart();
  var items=cart.map(function(i){return {productId:i.id,size:i.size,qty:i.qty};});
  var customer={name:name,phone:phone,email:email,city:city,address:addr,notes:notes};
  var orderId='';
  try{ var x=new XMLHttpRequest(); x.open('POST','/api/orders',false); x.setRequestHeader('Content-Type','application/json'); x.send(JSON.stringify({items:items,customer:customer}));
    if(x.status>=200&&x.status<300){ var o=JSON.parse(x.responseText).order; if(o&&o.id) orderId=o.id; }
    else { var e=JSON.parse(x.responseText); err.textContent=(e&&e.error)||'Could not place order. Please try again.'; btn.disabled=false; btn.textContent='Place order (COD) 🍫'; return; }
  }catch(ex){ err.textContent='Network error. Please try again.'; btn.disabled=false; btn.textContent='Place order (COD) 🍫'; return; }
  localStorage.removeItem('fudgio_cart'); updateCount();
  var trackUrl='/track?id='+encodeURIComponent(orderId)+'&phone='+encodeURIComponent(phone);
  document.getElementById('root').innerHTML='<div class="empty"><div class="em">✅</div>'
    +'<h1 style="font-family:var(--display)">Order placed!</h1>'
    +'<p style="margin:6px 0 2px">Your tracking number is</p>'
    +'<div style="font-family:var(--display);font-weight:900;font-size:1.8rem;color:var(--accent);letter-spacing:1px;margin:6px 0 4px">'+orderId+'</div>'
    +'<p>Thanks, '+name+'! We\'ve received your order and will confirm shortly. Pay cash on delivery. 🍫<br>Save your tracking number to check your order status anytime.</p>'
    +'<div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:22px">'
    +'<a href="'+trackUrl+'" class="btn btn-primary">📦 Track your order</a>'
    +'<a href="/menu" class="btn btn-ghost">Order more</a></div></div>';
  window.scrollTo(0,0);
}
render();
</script>
</body>
</html>
