<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brownie Bliss | Checkout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <div class="noise"></div>

  <header class="nav">
    <div class="container">
      <div class="nav-inner">
        <a class="brand" href="index.html"><span class="logo">BB</span> Brownie Bliss</a>
        <nav class="nav-links">
          <a href="index.html">Home</a>
          <a href="products.html">Products</a>
          <a href="cart.html">Cart (<span class="cart-count">0</span>)</a>
          <a class="active" href="checkout.html">Checkout</a>
          <a href="admin.html">Admin</a>
        </nav>
        <a class="nav-cta" href="admin.html">Admin Orders</a>
        <button class="menu-btn" id="menuBtn" aria-label="Open menu">Menu</button>
      </div>
      <div class="mobile-links" id="mobileLinks">
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="cart.html">Cart (<span class="cart-count">0</span>)</a>
        <a href="checkout.html">Checkout</a>
        <a href="admin.html">Admin</a>
      </div>
    </div>
  </header>

  <main>
    <section class="container page-grid">
      <article class="panel">
        <h2>Checkout</h2>
        <div class="notice">Payment Method: <strong>Cash on Delivery (COD)</strong></div>
        <form id="checkoutForm" class="form-grid">
          <label>Full Name
            <input name="fullName" required />
          </label>
          <label>Phone Number
            <input name="phone" required />
          </label>
          <label>City
            <input name="city" required />
          </label>
          <label>Address
            <textarea name="address" required></textarea>
          </label>
          <label>Order Notes (Optional)
            <textarea name="notes"></textarea>
          </label>
          <button class="btn btn-primary" type="submit">Place COD Order</button>
        </form>
        <p class="small" id="result"></p>
      </article>

      <article class="panel">
        <h3>Summary</h3>
        <div id="summary"></div>
      </article>
    </section>
  </main>

  <script src="assets/store.js"></script>
  <script src="assets/site.js"></script>
  <script>
    const store = window.BrownieStore;
    const summaryNode = document.getElementById("summary");
    const resultNode = document.getElementById("result");

    function renderSummary() {
      const items = store.getCartWithDetails();
      const totals = store.getCartTotals();

      if (!items.length) {
        summaryNode.innerHTML = "<p>Your cart is empty. <a href='products.html'>Add products</a>.</p>";
        return false;
      }

      summaryNode.innerHTML = `
        ${items.map((item) => `<p class="row"><span>${item.product.name} x ${item.qty}</span><strong>${store.formatPkr(item.lineTotal)}</strong></p>`).join("")}
        <hr style="border-color: rgba(255,255,255,0.14);" />
        <p class="row"><span>Subtotal</span><strong>${store.formatPkr(totals.subtotal)}</strong></p>
        <p class="row"><span>Delivery</span><strong>${store.formatPkr(totals.delivery)}</strong></p>
        <p class="row"><span>Total</span><strong>${store.formatPkr(totals.total)}</strong></p>
      `;
      return true;
    }

    const hasItems = renderSummary();

    document.getElementById("checkoutForm").addEventListener("submit", (event) => {
      event.preventDefault();

      if (!hasItems) {
        resultNode.textContent = "Your cart is empty.";
        return;
      }

      const formData = new FormData(event.target);
      const customer = {
        fullName: formData.get("fullName"),
        phone: formData.get("phone"),
        city: formData.get("city"),
        address: formData.get("address"),
        notes: formData.get("notes")
      };

      const order = store.placeOrder(customer);
      if (!order) {
        resultNode.textContent = "Unable to place order. Add items and try again.";
        return;
      }

      resultNode.textContent = `Order ${order.id} placed successfully with COD.`;
      event.target.reset();
      renderSummary();
      setTimeout(() => {
        window.location.href = "admin.html";
      }, 1200);
    });
  </script>
</body>
</html>
