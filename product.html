<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brownie Bliss | Product Detail</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <div class="noise"></div>

  <header class="nav">
    <div class="container">
      <div class="nav-inner">
        <a class="brand" href="index.html"><span class="logo">BB</span> Brownie Bliss</a>
        <nav class="nav-links">
          <a href="index.html">Home</a>
          <a class="active" href="products.html">Products</a>
          <a href="cart.html">Cart (<span class="cart-count">0</span>)</a>
          <a href="checkout.html">Checkout</a>
          <a href="admin.html">Admin</a>
        </nav>
        <a class="nav-cta" href="checkout.html">Checkout</a>
        <button class="menu-btn" id="menuBtn" aria-label="Open menu">Menu</button>
      </div>
      <div class="mobile-links" id="mobileLinks">
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="cart.html">Cart (<span class="cart-count">0</span>)</a>
        <a href="checkout.html">Checkout</a>
        <a href="admin.html">Admin</a>
      </div>
    </div>
  </header>

  <main>
    <section class="container page-grid">
      <article class="panel">
        <div id="productThumb" class="product-thumb"></div>
      </article>

      <article class="panel">
        <p class="small" id="badge"></p>
        <h2 id="name">Product</h2>
        <p id="description"></p>
        <h3 id="price"></h3>

        <div class="form-grid" style="max-width: 180px; margin-top: 14px;">
          <label>Quantity
            <input id="qty" type="number" min="1" value="1" />
          </label>
        </div>

        <div class="actions" style="margin-top: 16px;">
          <button id="addToCart" class="btn btn-primary">Add to Cart</button>
          <a class="btn btn-secondary" href="products.html">Back to Products</a>
        </div>
      </article>
    </section>
  </main>

  <footer class="footer">
    <div class="container row">
      <div class="small">All prices shown in PKR.</div>
      <div class="small">Payment method: Cash on Delivery only.</div>
    </div>
  </footer>

  <script src="assets/store.js"></script>
  <script src="assets/site.js"></script>
  <script>
    const store = window.BrownieStore;
    const params = new URLSearchParams(window.location.search);
    const productId = params.get("id");
    const product = store.getProductById(productId);

    if (!product) {
      document.querySelector("main").innerHTML = "<section class='container'><p>Product not found.</p></section>";
    } else {
      document.getElementById("badge").textContent = product.badge || "Fresh";
      document.getElementById("name").textContent = product.name;
      document.getElementById("description").textContent = product.description;
      document.getElementById("price").textContent = store.formatPkr(product.pricePkr);

      const thumb = document.getElementById("productThumb");
      thumb.classList.add(product.tone || "tone-1");

      document.getElementById("addToCart").addEventListener("click", () => {
        const qty = Number(document.getElementById("qty").value);
        if (!qty || qty < 1) {
          alert("Please enter a valid quantity.");
          return;
        }
        store.addToCart(product.id, qty);
        alert("Added to cart.");
        window.location.href = "cart.html";
      });
    }
  </script>
</body>
</html>
