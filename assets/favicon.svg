<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7c485"/>
      <stop offset="0.5" stop-color="#d98e4a"/>
      <stop offset="1" stop-color="#ff6f91"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#7a5236"/>
      <stop offset="1" stop-color="#513120"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d2315"/>
      <stop offset="1" stop-color="#1d0f08"/>
    </linearGradient>
  </defs>

  <!-- brand tile -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <circle cx="18" cy="14" r="22" fill="#fff" opacity="0.15"/>

  <!-- brownie body (large for 16px legibility) -->
  <path d="M8 26h48v22a6 6 0 0 1-6 6H14a6 6 0 0 1-6-6z" fill="url(#side)"/>
  <!-- crackly top slab -->
  <path d="M14 10h36a6 6 0 0 1 6 6v10H8V16a6 6 0 0 1 6-6z" fill="url(#top)"/>
  <!-- crackle -->
  <path d="M14 19c4-2.2 7.2 1.2 11.2 0s7-2.6 10.6-.8 6.2.5 9.2-1"
        stroke="#c08f61" stroke-width="2.6" stroke-linecap="round" fill="none" opacity="0.9"/>
  <!-- chocolate chunks -->
  <rect x="15" y="33" width="9" height="7" rx="2.2" fill="#0d0705" opacity="0.9"/>
  <rect x="28.5" y="38" width="10" height="7" rx="2.2" fill="#0d0705" opacity="0.75"/>
  <rect x="43" y="32" width="8" height="6.5" rx="2" fill="#0d0705" opacity="0.85"/>

  <!-- gloss edge -->
  <rect x="8" y="26" width="48" height="3" fill="#fff" opacity="0.14"/>
</svg>
